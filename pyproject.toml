[project]
name = "wdrd"
version = "0.1.0"
description = "Import data from Riksdagen to Wikidata"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "setuptools<81", # WikidataIntegrator 0.9.30 still imports pkg_resources
    "wikidataintegrator",
    "lightrdf",
    "pandas",
    "pyshex",
    "requests",
    "simplejson",
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
    "python-dotenv"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wdrd*"]
